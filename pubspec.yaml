name: smartattend
description: A comprehensive University Attendance System with dual biometric authentication and GPS location verification.

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database
  sqflite: ^2.0.0+3
  path: ^1.8.0
  sqflite_common_ffi: ^2.3.6

  # State Management
  provider: ^6.0.0

  # Biometric Authentication
  local_auth: ^2.1.0
  camera: ^0.10.5+9
  google_ml_kit: ^0.18.0

  # Location Services
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Notifications
  flutter_local_notifications: ^19.4.2

  # UI Components
  table_calendar: ^3.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  # Utilities
  uuid: ^4.2.1
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  syncfusion_flutter_charts: ^31.2.2
  pdf: ^3.11.3
  csv: ^6.0.0
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
